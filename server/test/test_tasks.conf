# Connection settings for test_tasks.py.
#
# The suite drives the JSON API of a manager server that is not necessarily the
# one installed on this host, so the address it talks to is configuration, not
# something discovered from the local $CUBRID. Without this file the run stops
# before the first request rather than guessing a host.
#
# "key value" and "key=value" are both accepted, "#" starts a comment.

# Host the CUBRID Manager Server under test runs on.
cmsip 127.0.0.1

# Port it serves cm_api on, cm_port in that host's $CUBRID/conf/cm.conf.
port 8001
