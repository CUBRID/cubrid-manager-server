# cm.conf 
#     -- CUBRID database management tool server configuration file
#
#
# When server starts, it looks for the environment variable 
# 'CUBRID_MANAGER' and use it to locate this file. It is assumed that
# 'CUBRID_MANAGER' is the root directory of all CUBRID Manager related files.
#
# Manager server section - a section for 'cubrid service' command
# Common section - properties for CUBRID Manager Server
# This section will be applied before starting manager server.
[cm]
#
# Port number designation
# A port for the connection between CUBRID Manager server and Client.
# CUBRID Manager server uses the value cm_port. 
# The default value is 8001. 
#
cm_port=8001

#
# Generate the TLS key pair (conf/cm_ssl_cert.crt, conf/cm_ssl_cert.key) when it
# does not exist, and replace a key pair shipped by an earlier version, whose
# private key is public (YES/NO), default YES.
# With NO, CMS does not start without a key pair, and starts with an error log
# when it uses a shipped one (it does not start if OpenSSL refuses that key, for
# example an RSA 1024 key at TLS security level 2 or higher). A key pair
# installed by the administrator is never replaced. Any other value is logged
# and YES is used.
#
#ssl_cert_auto_generate=YES

#
# Names and addresses added to the subject alternative names of a key pair that
# CMS generates (default: the host name, localhost, 127.0.0.1 and ::1). Needed
# only by clients that verify the host name, for the names or addresses they
# connect to. DNS:<name> or IP:<address>, separated by commas, at most 32, on
# one line of at most 1023 characters (a longer line is ignored).
# Used only when a key pair is generated: after a change, remove
# conf/cm_ssl_cert.crt and conf/cm_ssl_cert.key and restart.
#
#ssl_cert_san=DNS:cms.example.com,IP:10.0.0.5

#
# CMS Process Monitoring interval setting
#
cm_process_monitor_interval=5

#
# Maximum number of sessions (logins) one CUBRID Manager user can hold at once.
# An integer from 1 to 64, default 16; set 1 for one session per user.
#
#max_sessions_per_user=16

###############################
# diagnostics parameter
###############################
#
# turn ON/OFF diag
#
#execute_diag=ON

#
# server long query time (sec)
#
server_long_query_time=10

#
# Auto jobs execution timeout (sec)
# Default value: 43200 (12 hours)
# Minimum value: 60
auto_job_timeout=43200

#
# Define token active time (session timeout) in seconds, default value is 7200.
# An integer from 1 to 2147483647; any other value is logged and 7200 is used.
#
#token_active_time=7200

#
# Compare the IP address of each request with the IP address its session
# logged in from (off/log/enforce), default log.
#   off     : do not compare.
#   log     : on a mismatch, write a warning to the log and process the request.
#   enforce : on a mismatch, write a warning to the log, reject the request as
#             an invalid token and delete the session.
# Set enforce only when each client has a fixed IP address and does not share
# its token with other hosts: behind a proxy pool, or with clients that share
# one token, valid requests come from different addresses.
# Any other value is logged and log is used.
#
#session_ip_check=log

#
# support monitoring statistic (YES/NO), default NO
# If you want to use the advanced monitoring feature on CUBRID Manager,
# you should set this value to YES.
#
support_mon_statistic=NO

#
# max log file number: default 10
# When the log files is more than max_log_files,
# The oldest log will be removed.
#
max_log_files=10
#
# max number of async jobs running
# Minimum: 1
# Default: 8
# Maximum: 12
# max_num_async_task=8
#

#
# time to live of a UUID received upon submission of the asynchronous task
# Minimum: 60 secs
# Default: 3600 secs
# Maximum: 604800 secs (1 week)
# async_job_ttl_sec=3600
#

#
# async_long_job_sec
# for LONG job warning log
# Minimum: 60 secs
# Default: 86400 secs (1 day)
# Maximum: 604800 secs (1 week)
# async_long_job_sec=86400
#
