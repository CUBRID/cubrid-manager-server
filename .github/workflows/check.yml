name: github-checks
on: 
  pull_request:
    branches:
      - develop
jobs:
  pr-style:
    name: pr-style
    runs-on: ubuntu-24.04
    steps:
      - uses: deepakputhraya/action-pr-title@master
        with:
          regex: '^\[[A-Z]+-\d+\]\s.+' # Regex the title should match.
  code-style:
    name: code-style
    runs-on: ubuntu-24.04
    env:
      working-directory: .github/workflows
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: |
          # dependencies to build GNU indent
          sudo apt-get -yq install build-essential texi2html wget
          
          # install astyle
          sudo apt-get -yq install astyle
        working-directory: ${{ env.working-directory }}
      - id: files
        uses: ./.github/actions/changed-files
      - name: Check code style
        id: stylecheck
        env:
          # The changed file list is controlled by the PR author, so it must never be
          # interpolated into the script body. It is passed through the environment and
          # parsed as JSON below.
          ADDED_MODIFIED: ${{ steps.files.outputs.added_modified }}
        run: |
          # The changed file list must never be silently empty: if the step above broke
          # (API, permissions, network) the loop would check nothing and this required
          # gate would pass. An empty list is only acceptable as a well-formed [].
          # (jq -e exits 0 on empty input, so the emptiness must be tested separately.)
          if [ -z "$ADDED_MODIFIED" ] || ! jq -e 'type == "array"' <<< "$ADDED_MODIFIED" > /dev/null 2>&1; then
            echo "::error::changed file list is missing or malformed - refusing to report success without checking anything"
            exit 1
          fi

          checked=0
          while IFS= read -r -d '' f; do
            # only files under server/src are checked.
            if [[ $f != server/src/* ]]; then
              continue
            fi

            .github/workflows/codestyle.sh "$f"
            checked=$((checked + 1))
          done < <(jq -j '.[] | select(type == "string") | . + "\u0000"' <<< "$ADDED_MODIFIED")
          echo "code style checked $checked file(s) under server/src"
          git diff | tee gitdiff
          test ! -s gitdiff # is empty? yes: 0 no: 1
      - name: Suggest code changes
        if: ${{ failure() }}
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: code-style (indent, astyle)
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - name: Install packages
        run: |
          sudo apt-get install -yq wget build-essential

          # Download cppcheck-2.13.0 source
          wd=`pwd`
          cd ..
          wget https://github.com/CUBRID/3rdparty/raw/develop/cppcheck/2.13.0.tar.gz
          tar xf 2.13.0.tar.gz

          # build cppcheck-2.13.0
          cd cppcheck-2.13.0
          make -j4 MATCHCOMPILER=yes CFGDIR=cfg CXXFLAGS="-O2 -DNDEBUG -Wall -Wno-sign-compare -Wno-unused-function"
          echo "CPPCHECK_PATH=`pwd`" >> $GITHUB_ENV

          cd $wd
      - uses: actions/checkout@v5
      - id: files
        uses: ./.github/actions/changed-files
      - name: cppcheck
        env:
          # The changed file list is controlled by the PR author, so it must never be
          # interpolated into the script body. It is passed through the environment and
          # parsed as JSON below.
          ADDED_MODIFIED: ${{ steps.files.outputs.added_modified }}
        run: |
          # The changed file list must never be silently empty: if the step above broke
          # (API, permissions, network) the loop would check nothing and this required
          # gate would pass. An empty list is only acceptable as a well-formed [].
          # (jq -e exits 0 on empty input, so the emptiness must be tested separately.)
          if [ -z "$ADDED_MODIFIED" ] || ! jq -e 'type == "array"' <<< "$ADDED_MODIFIED" > /dev/null 2>&1; then
            echo "::error::changed file list is missing or malformed - refusing to report success without checking anything"
            exit 1
          fi

          result_file="cppcheck.result"
          summary_file="cppcheck.summary"

          touch "$result_file"
          touch "$summary_file"

          # to suppress other error, add it to .github/workflows/cppcheck-spr-list
          checked=0
          while IFS= read -r -d '' f; do
            if [ -d "$f" ]; then
              continue
            fi

            # only files under server/src are checked.
            if [[ $f != server/src/* ]]; then
              continue
            fi

            set +e
            ext=$(expr "$f" : ".*\(\..*\)")
            set -e

            case $ext in
            .c|.h|.cpp|.hpp|.C|.H|.CPP|.HPP) true;; # only these formats are checked.
            *) continue ;; # skip others
            esac

            "$CPPCHECK_PATH/cppcheck" --force -j4 --inline-suppr --suppressions-list=.github/workflows/cppcheck-spr-list --quiet --enable=warning "$f" 2>>"$result_file"
            checked=$((checked + 1))
          done < <(jq -j '.[] | select(type == "string") | . + "\u0000"' <<< "$ADDED_MODIFIED")
          echo "cppcheck checked $checked file(s) under server/src"

          echo "errors: $(grep -c ' error: ' "$result_file" || true)" > "$summary_file"
          echo "warnings: $(grep -c ' warning: ' "$result_file" || true)" >> "$summary_file"

          echo "-----------------------------Result-------------------------------------"
          cat "$result_file"
          echo "-----------------------------Summary------------------------------------"
          cat "$summary_file"

          ! grep " error: " "$result_file" 1>/dev/null # if has errors, fail
      - name: Get cppcheck.summary
        id: get-comment-body
        if: ${{ failure() }}
        run: |
          # ::set-output is removed from GitHub Actions; write to $GITHUB_OUTPUT instead.
          # A random heredoc delimiter keeps the multi-line body from being able to
          # terminate the block early, so no percent-encoding is needed.
          delimiter="$(openssl rand -hex 16)"
          {
            echo "body<<${delimiter}"
            cat cppcheck.summary
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
      - name: Report cppcheck.summary
        if: ${{ failure() }}
        uses: unsplash/comment-on-pr@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          check_for_duplicate_msg: true  # OPTIONAL 
          msg: |
            **cppcheck**
            ${{ steps.get-comment-body.outputs.body }}
